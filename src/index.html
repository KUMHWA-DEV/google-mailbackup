<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mail Backup</title>
<style>
  :root {
    --bg: #f8fafc; --panel: #ffffff; --ink: #0f172a; --ink2: #334155; --muted: #64748b; --faint: #94a3b8;
    --line: #e2e8f0; --line2: #f1f5f9; --soft: #f8fafc;
    --blue: #2563eb; --blue-d: #1d4ed8; --blue-bg: #eff6ff; --blue-line: #bfdbfe; --blue-ink: #1e40af;
    --green: #059669; --green-bg: #ecfdf5; --green-line: #a7f3d0; --green-ink: #065f46;
    --amber: #d97706; --amber-bg: #fffbeb; --amber-line: #fde68a; --amber-ink: #92400e;
    --red: #dc2626; --red-bg: #fef2f2; --red-line: #fecaca; --red-ink: #991b1b;
    --purple-bg: #f5f3ff; --purple-line: #ddd6fe; --purple-ink: #5b21b6;
    --dark: #0f172a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 13px/1.5 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", system-ui, sans-serif; }
  a { color: var(--blue); text-decoration: none; }
  button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: #fff; color: var(--ink2); border-radius: 10px; padding: 8px 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; transition: background .12s, border-color .12s; }
  button:hover { background: var(--soft); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  button.primary:hover { background: var(--blue-d); }
  button.warn { background: var(--amber); border-color: var(--amber); color: #fff; box-shadow: 0 0 0 4px rgba(217,119,6,.15); }
  button.sm { padding: 5px 9px; font-size: 12px; border-radius: 8px; }
  button.ib { border: 0; background: transparent; width: 34px; height: 34px; padding: 0; border-radius: 50%; justify-content: center; font-size: 16px; color: var(--ink2); }
  button.ib:hover { background: var(--line2); }
  input, select { font: inherit; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 10px; background: #fff; color: var(--ink); width: 100%; min-width: 0; }
  input:focus, select:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 16px 48px; }
  [hidden] { display: none !important; }

  /* switch */
  .sw { position: relative; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 600; font-size: 13px; user-select: none; }
  .sw input { position: absolute; opacity: 0; width: 0; height: 0; }
  .sw i { width: 38px; height: 22px; border-radius: 999px; background: #cbd5e1; position: relative; transition: background .15s; flex: none; }
  .sw i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .sw input:checked + i { background: var(--green); }
  .sw input:checked + i::after { left: 19px; }
  .sw input:disabled + i { opacity: .5; }

  /* header */
  header { background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
  header .inner { max-width: 1240px; margin: 0 auto; padding: 10px 16px 0; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 700; }
  .logo { width: 34px; height: 34px; border-radius: 10px; background: var(--blue); color: #fff; display: grid; place-items: center; font-size: 17px; }
  nav { display: flex; gap: 2px; margin-left: 8px; }
  nav button { border: 0; border-bottom: 2px solid transparent; border-radius: 8px 8px 0 0; background: transparent; color: var(--muted); padding: 12px 14px; font-size: 13px; white-space: nowrap; position: relative; }
  nav button.active { color: var(--blue-ink); border-bottom-color: var(--blue); }
  nav button:hover { background: var(--line2); }
  .pulse { position: absolute; top: 8px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--amber); animation: pulse 1.4s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  .hright { margin-left: auto; display: flex; align-items: center; gap: 4px; color: var(--muted); font-size: 12px; }
  .hright a { color: var(--ink2); }
  .hright .user { margin-left: 6px; }

  /* blocks */
  .page { padding-top: 18px; display: flex; flex-direction: column; gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; box-shadow: 0 1px 2px rgba(15,23,42,.04); }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 900px) { .grid4, .grid3, .grid2 { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 560px) { .grid4, .grid3, .grid2 { grid-template-columns: 1fr; } }
  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; border: 1px solid transparent; white-space: nowrap; }
  .pill.blue { background: var(--blue-bg); color: var(--blue-ink); border-color: var(--blue-line); }
  .pill.green { background: var(--green-bg); color: var(--green-ink); border-color: var(--green-line); }
  .pill.amber { background: var(--amber-bg); color: var(--amber-ink); border-color: var(--amber-line); }
  .pill.purple { background: var(--purple-bg); color: var(--purple-ink); border-color: var(--purple-line); }
  .pill.gray { background: var(--line2); color: var(--ink2); border-color: var(--line); }

  /* status card */
  .status { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .status .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--green); flex: none; }
  .status .dot.due { background: var(--amber); animation: pulse 1.4s infinite; }
  .status .dot.running { background: var(--blue); animation: pulse 1s infinite; }
  .status .main { font-size: 16px; font-weight: 700; }
  .status .sub { color: var(--muted); font-size: 13px; }
  .status .actions { margin-left: auto; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .bar { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; margin-top: 14px; }
  .bar i { display: block; height: 100%; background: var(--blue); border-radius: 999px; transition: width .4s; }
  .bar i.due { background: var(--amber); }
  .barlbl { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 6px; }

  /* stat tiles */
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; display: flex; gap: 14px; align-items: center; min-width: 0; }
  .stat .ic { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; font-size: 20px; background: var(--blue-bg); flex: none; }
  .stat .k { font-size: 12px; color: var(--muted); }
  .stat .v { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat .d { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat .txt { min-width: 0; }

  /* tables */
  .cardhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .cardhead h3 { margin: 0; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { text-align: left; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 10px; border-bottom: 1px solid var(--line2); vertical-align: middle; white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  .empty { padding: 36px 16px; text-align: center; color: var(--faint); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
  .banner { border-radius: 12px; padding: 10px 14px; font-size: 12px; font-weight: 600; display: flex; justify-content: space-between; gap: 12px; align-items: center; border: 1px solid; }
  .banner.error { background: var(--red-bg); border-color: var(--red-line); color: var(--red-ink); }
  .banner button { background: transparent; border: 0; color: inherit; padding: 0; }

  /* settings */
  .field { display: grid; gap: 6px; min-width: 0; }
  .field label.t { font-size: 12px; font-weight: 600; color: var(--ink2); display: flex; align-items: center; gap: 6px; }
  .field .row { display: flex; align-items: center; gap: 8px; }
  .field .row input { flex: 1; }
  .field .unit { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .seg { display: inline-flex; background: var(--line2); border-radius: 10px; padding: 3px; gap: 3px; }
  .seg button { border: 0; background: transparent; border-radius: 8px; padding: 6px 12px; font-size: 12px; color: var(--ink2); }
  .seg button.active { background: #fff; color: var(--blue-ink); box-shadow: 0 1px 2px rgba(15,23,42,.12); }
  .toggles { display: flex; gap: 22px; flex-wrap: wrap; padding: 4px 0; }
  .sethead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .sethead h3 { margin: 0; font-size: 15px; }
  .divider { border-top: 1px solid var(--line2); margin: 16px 0; }

  /* modal & toast */
  .modalbg { position: fixed; inset: 0; background: rgba(15,23,42,.55); backdrop-filter: blur(2px); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal { background: #fff; border-radius: 16px; width: 100%; max-width: 420px; padding: 22px; box-shadow: 0 24px 60px rgba(15,23,42,.3); }
  .modal h3 { margin: 0 0 12px; font-size: 16px; }
  .modal .box { background: var(--soft); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 16px; display: grid; gap: 6px; font-size: 13px; color: var(--ink2); }
  .modal .btns { display: flex; justify-content: flex-end; gap: 8px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--dark); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 13px; font-weight: 600; box-shadow: 0 10px 30px rgba(15,23,42,.3); z-index: 60; max-width: 90vw; }
  .toast.error { background: var(--red); }
  .spin { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.35); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* explorer */
  .gm { padding: 0; overflow: hidden; display: flex; flex-direction: column; height: calc(100vh - 150px); min-height: 600px; background: #fff; font-family: "Google Sans", Roboto, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; color: #202124; }
  .gm-top { display: flex; align-items: center; gap: 12px; padding: 8px 12px 8px 16px; border-bottom: 1px solid #e0e3e7; background: #fff; }
  .gm-top .brandx { display: flex; align-items: center; gap: 8px; width: 216px; flex: none; font-size: 15px; font-weight: 500; color: #444746; }
  .gm-top .brandx .m { width: 28px; height: 28px; border-radius: 8px; background: #d93025; color: #fff; display: grid; place-items: center; font-size: 15px; }
  .gm-search { flex: 1; max-width: 720px; display: flex; align-items: center; gap: 10px; background: #eaf1fb; border-radius: 24px; height: 46px; padding: 0 8px 0 16px; transition: background .15s, box-shadow .15s; }
  .gm-search:focus-within { background: #fff; box-shadow: 0 1px 1px rgba(0,0,0,.24), 0 0 0 1px rgba(0,0,0,.12); }
  .gm-search .ic { color: #444746; font-size: 16px; }
  .gm-search input { border: 0; background: transparent; font-size: 15px; padding: 0; height: 100%; box-shadow: none; color: #202124; }
  .gm-search input:focus { box-shadow: none; }
  .gm-search button { border: 0; background: transparent; color: #444746; padding: 6px; border-radius: 50%; font-size: 15px; }
  .gm-search button:hover { background: rgba(60,64,67,.08); }
  .gm-top .right { margin-left: auto; display: flex; align-items: center; gap: 4px; color: #444746; font-size: 12px; }
  .gm-top .right select { width: auto; border: 0; background: transparent; padding: 6px 4px; font-size: 12px; color: #444746; box-shadow: none; }
  .gm-ib { border: 0; background: transparent; color: #444746; width: 34px; height: 34px; border-radius: 50%; padding: 0; display: grid; place-items: center; font-size: 15px; }
  .gm-ib:hover { background: rgba(60,64,67,.08); }
  .gm-ib:disabled { opacity: .35; }
  .gm-body { flex: 1; display: flex; min-height: 0; }
  .gm-nav { width: 232px; flex: none; background: #f6f8fc; padding: 10px 12px 10px 0; overflow-y: auto; font-size: 14px; }
  .gm-nav .sec { color: #444746; font-size: 12px; font-weight: 500; padding: 14px 0 4px 24px; letter-spacing: .02em; }
  .gm-nav .it { display: flex; align-items: center; gap: 14px; height: 32px; padding: 0 12px 0 24px; border-radius: 0 16px 16px 0; cursor: pointer; color: #202124; user-select: none; }
  .gm-nav .it:hover { background: rgba(60,64,67,.08); }
  .gm-nav .it.active { background: #d3e3fd; font-weight: 700; }
  .gm-nav .it .ic { width: 20px; text-align: center; font-size: 15px; flex: none; }
  .gm-nav .it .lb { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gm-nav .it .ct { font-size: 12px; color: #444746; }
  .gm-nav .it.active .ct { color: #202124; }
  .gm-nav .it .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; margin: 0 5px; }
  .gm-nav .runsel { margin: 14px 0 0 24px; font-size: 12px; color: #444746; }
  .gm-nav .runsel select { width: calc(100% - 4px); border: 1px solid #dadce0; border-radius: 8px; padding: 6px 8px; font-size: 12px; background: #fff; margin-top: 4px; }
  .gm-main { flex: 1; display: flex; min-width: 0; background: #fff; border-radius: 16px 0 0 0; box-shadow: 0 0 0 1px #e0e3e7 inset; }
  .gm-listwrap { width: 54%; min-width: 380px; display: flex; flex-direction: column; border-right: 1px solid #e0e3e7; min-height: 0; }
  .gm-tools { display: flex; align-items: center; gap: 4px; padding: 6px 8px 6px 14px; border-bottom: 1px solid #e0e3e7; font-size: 12px; color: #444746; min-height: 48px; }
  .gm-tools .pg { margin-left: auto; display: flex; align-items: center; gap: 2px; white-space: nowrap; }
  .gm-tools .chipx { display: inline-flex; align-items: center; gap: 4px; border: 1px solid #dadce0; border-radius: 8px; padding: 3px 10px; font-size: 12px; color: #444746; background: #fff; cursor: pointer; }
  .gm-tools .chipx:hover { background: #f1f3f4; }
  .gm-list { flex: 1; overflow-y: auto; min-height: 0; }
  .gm-row { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px 0 10px; border-bottom: 1px solid #e8eaed; cursor: pointer; font-size: 14px; color: #202124; position: relative; background: #f2f6fc; }
  .gm-row:hover { background: #fff; box-shadow: inset 1px 0 0 #dadce0, inset -1px 0 0 #dadce0, 0 1px 2px 0 rgba(60,64,67,.3), 0 1px 3px 1px rgba(60,64,67,.15); z-index: 1; }
  .gm-row.active { background: #c2e7ff; }
  .gm-row .star { color: #c4c7c5; font-size: 16px; flex: none; width: 22px; text-align: center; }
  .gm-row .star.on { color: #f4b400; }
  .gm-row .sd { width: 150px; flex: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 400; text-align: left; }
  .gm-row .sd.sentme { font-weight: 400; color: #444746; }
  .gm-row .sd .to { color: #444746; font-weight: 400; }
  .gm-row .txt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
  .gm-row .txt .lb { flex: none; font-size: 11px; padding: 1px 7px; border-radius: 4px; font-weight: 500; }
  .gm-row .txt .sj { font-weight: 400; }
  .gm-row .txt .sn { color: #5f6368; }
  .gm-row .att { flex: none; color: #5f6368; font-size: 14px; }
  .gm-row .dt { flex: none; width: 64px; text-align: right; font-size: 12px; color: #5f6368; }
  .gm-row.active .dt, .gm-row.active .sn { color: #202124; }
  .gm-empty { padding: 60px 20px; text-align: center; color: #5f6368; font-size: 13px; }
  .gm-empty b { display: block; color: #202124; font-size: 15px; margin: 10px 0 4px; font-weight: 500; }
  .gm-reader { flex: 1; min-width: 0; overflow-y: auto; display: flex; flex-direction: column; }
  .gm-rt { display: flex; align-items: center; gap: 2px; padding: 6px 12px; border-bottom: 1px solid #e0e3e7; min-height: 48px; }
  .gm-rt .sp { flex: 1; }
  .gm-rt a { color: inherit; text-decoration: none; }
  .gm-msg { padding: 8px 24px 40px; }
  .gm-msg h2 { font-size: 22px; font-weight: 400; margin: 12px 0 14px; line-height: 1.3; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .gm-msg h2 .lb { font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 500; }
  .gm-hd { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 18px; }
  .gm-av { width: 40px; height: 40px; border-radius: 50%; color: #fff; display: grid; place-items: center; font-size: 17px; font-weight: 500; flex: none; }
  .gm-hd .l { flex: 1; min-width: 0; font-size: 12px; color: #5f6368; }
  .gm-hd .l .fr { font-size: 14px; color: #202124; display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
  .gm-hd .l .fr b { font-weight: 700; }
  .gm-hd .l details { margin-top: 2px; }
  .gm-hd .l summary { cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 4px; }
  .gm-hd .l summary::-webkit-details-marker { display: none; }
  .gm-hd .l table { font-size: 12px; margin-top: 8px; border: 1px solid #e0e3e7; border-radius: 8px; padding: 8px; border-collapse: separate; }
  .gm-hd .l table td { padding: 2px 8px 2px 0; border: 0; vertical-align: top; }
  .gm-hd .l table td:first-child { color: #5f6368; text-align: right; white-space: nowrap; }
  .gm-hd .r { font-size: 12px; color: #5f6368; white-space: nowrap; display: flex; align-items: center; gap: 2px; }
  .gm-bd { font-size: 14px; line-height: 1.6; color: #202124; white-space: pre-wrap; word-break: break-word; padding: 4px 0 8px 54px; }
  .gm-atts { margin: 12px 0 0 54px; border-top: 1px solid #e0e3e7; padding-top: 14px; }
  .gm-atts .t { font-size: 13px; color: #444746; display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .gm-atts .t a { color: #0b57d0; }
  .gm-cards { display: flex; flex-wrap: wrap; gap: 12px; }
  .gm-card { width: 200px; border: 1px solid #dadce0; border-radius: 8px; overflow: hidden; background: #fff; position: relative; }
  .gm-card .pv { height: 96px; background: #f1f3f4; display: grid; place-items: center; font-size: 36px; overflow: hidden; }
  .gm-card .pv img { width: 100%; height: 100%; object-fit: cover; }
  .gm-card .ft { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-top: 1px solid #e0e3e7; }
  .gm-card .ft .ic { font-size: 16px; flex: none; }
  .gm-card .ft .nm { flex: 1; min-width: 0; font-size: 12px; font-weight: 500; color: #202124; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gm-card .ft .sz { font-size: 11px; color: #5f6368; display: block; font-weight: 400; }
  .gm-card .ov { position: absolute; inset: 0 0 41px 0; background: rgba(32,33,36,.6); display: flex; align-items: center; justify-content: center; gap: 8px; opacity: 0; transition: opacity .15s; }
  .gm-card:hover .ov { opacity: 1; }
  .gm-card .ov a { width: 36px; height: 36px; border-radius: 50%; background: #fff; color: #202124; display: grid; place-items: center; font-size: 16px; text-decoration: none; }
  .gm-card .ov a:hover { background: #e8eaed; }
  .gm-card.nodl .pv { opacity: .6; }
  .gm-note { font-size: 12px; color: #5f6368; margin-top: 8px; }
  .gm-ph { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: #5f6368; padding: 40px; font-size: 13px; }
  .gm-ph b { display: block; color: #202124; font-size: 16px; font-weight: 400; margin: 12px 0 4px; }
  .gm-back { display: none; }
  @media (max-width: 1000px) { .gm-nav { display: none; } .gm-navchips { display: flex; } }
  .gm-navchips { display: none; gap: 6px; padding: 8px 12px; overflow-x: auto; border-bottom: 1px solid #e0e3e7; }
  @media (max-width: 760px) {
    .gm { height: auto; min-height: 640px; }
    .gm-top .brandx { display: none; }
    .gm-listwrap { width: 100%; min-width: 0; border-right: 0; }
    .gm-body.reading .gm-listwrap { display: none; }
    .gm-body:not(.reading) .gm-reader { display: none; }
    .gm-back { display: grid; }
    .gm-row .sd { width: 110px; }
    .gm-bd, .gm-atts { padding-left: 0; margin-left: 0; }
  }

</style>
</head>
<body>
<header>
  <div class="inner">
    <div class="brand"><div class="logo">✉️</div>Mail Backup</div>
    <nav id="tabs">

<!-- DEV_SHIM -->
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var state = { dash: null, explorer: null, tab: 'overview', ex: { q: '', folder: '', agenda: '', category: '', run: 'all', selected: null }, pollTimer: null };

  // ---------- helpers ----------
  function call(fn, arg) {
    return new Promise(function (resolve, reject) {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](arg);
    });
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmtBytes(n) { n = Number(n) || 0; var u = ['B', 'KB', 'MB', 'GB', 'TB'], i = 0; while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; } return (i === 0 ? n : n.toFixed(n >= 100 ? 0 : 1)) + ' ' + u[i]; }
  function fmtNum(n) { return (Number(n) || 0).toLocaleString('ko-KR'); }
  function fmtDate(iso) { if (!iso) return ''; var d = new Date(iso); return isNaN(d) ? esc(iso) : d.toLocaleString('ko-KR', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }); }
  function fmtDay(iso) { if (!iso) return ''; var d = new Date(iso); return isNaN(d) ? esc(iso) : d.toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' }); }
  function fmtDayShort(iso) { if (!iso) return ''; var d = new Date(iso); return isNaN(d) ? esc(iso) : d.toLocaleDateString('ko-KR', { month: 'numeric', day: 'numeric' }); }
  function fmtDayLong(epoch) { return new Date(epoch * 1000).toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' }); }
  function nameOnly(addr) { var s = String(addr || ''); var m = s.match(/^\s*"?([^"<]*)"?\s*<.*>/); return (m && m[1].trim()) || s; }
  function isSentRec(r) { return r.category === '보낸편지함' || /(^|,\s*)SENT(\s*,|$)/.test(String(r.labels || '')); }
  function dur(a, b) { if (!a || !b) return ''; var s = Math.max(0, Math.round((new Date(b) - new Date(a)) / 1000)); return s < 60 ? s + '초' : Math.round(s / 60) + '분'; }
  var toastTimer;
  function toast(msg, isErr) { var t = $('toast'); t.textContent = msg; t.className = 'toast' + (isErr ? ' error' : ''); t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 3000); }
  function banner(msg) {
    var slot = $('banner-slot');
    slot.hidden = !msg;
    slot.innerHTML = msg ? '<div class="banner error"><span>⚠️ ' + esc(msg) + '</span><button type="button" id="bannerClose">✕</button></div>' : '';
    if (msg) $('bannerClose').onclick = function () { slot.hidden = true; };
  }

  // ---------- tabs ----------
  function showTab(name) {
    state.tab = name;
    ['overview', 'explorer', 'settings', 'history'].forEach(function (t) { $('tab-' + t).hidden = t !== name; });
    document.querySelectorAll('#tabs button').forEach(function (b) { b.classList.toggle('active', b.dataset.tab === name); });
    if (name === 'explorer' && !state.explorer) loadExplorer();
    if (name === 'settings' && state.dash) fillSettings(state.dash.settings);
  }
  $('tabs').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) showTab(b.dataset.tab); });
  document.querySelectorAll('[data-goto]').forEach(function (b) { b.addEventListener('click', function () { showTab(b.dataset.goto); }); });

  // ---------- dashboard ----------
  function renderDashboard(d) {
    state.dash = d;
    var s = d.settings || {}, sch = d.schedule || {}, sum = d.summary || {}, r = d.currentRun || {};
    var running = d.state === 'running' || d.state === 'queued';
    $('hdUser').textContent = d.user || '';
    $('hdFolder').hidden = !d.folderUrl; if (d.folderUrl) $('hdFolder').href = d.folderUrl;
    $('hdSheet').hidden = !d.indexSheetUrl; if (d.indexSheetUrl) $('hdSheet').href = d.indexSheetUrl;
    $('dueDot').hidden = !sch.isDue || running;

    $('stateDot').className = 'dot' + (running ? ' running' : sch.isDue ? ' due' : '');
    $('stateText').textContent = running ? '백업 진행 중' : (sch.isDue ? (d.lastSyncAt ? '백업할 때가 됐어요' : '첫 백업을 시작하세요') : '최신 상태');
    $('stateSub').textContent = running ? d.message
      : (d.lastSyncAt ? '마지막 ' + fmtDate(d.lastSyncAt) + ' · ' : '') + (sch.isDue ? sch.intervalDays + '일 주기' : '다음 ' + fmtDayLong(sch.nextRunEpoch) + ' (' + sch.daysRemaining + '일 후)');
    $('swAuto').checked = !!d.triggerInstalled;
    $('swAutoLbl').textContent = '자동 백업 · ' + sch.intervalDays + '일';
    $('btnRun').disabled = running;
    $('btnRun').className = running ? '' : (sch.isDue ? 'warn' : 'primary');
    $('btnRun').innerHTML = running ? '<span class="spin"></span> 진행 중' : '▶ 지금 백업';
    $('progressBar').style.width = sch.progressPercent + '%';
    $('progressBar').className = sch.isDue ? 'due' : '';
    $('progressL').textContent = sch.elapsedDays + '일 경과 / ' + sch.intervalDays + '일';
    $('progressR').textContent = sch.progressPercent + '%';

    $('stTotal').textContent = fmtNum(sum.total) + '건';
    $('stTotalD').textContent = '📥 ' + fmtNum(sum.receivedCount) + ' · 📤 ' + fmtNum(sum.sentCount) + ' · 📎 ' + fmtNum(sum.withAttachments);
    $('stBytes').textContent = fmtBytes(sum.totalBytes);
    $('stBytesD').textContent = sum.total ? '메일당 ' + fmtBytes(sum.totalBytes / sum.total) : '';
    $('stRange').textContent = sum.oldestDate ? fmtDayShort(sum.oldestDate) + ' ~ ' + fmtDayShort(sum.newestDate) : '-';
    $('stRangeD').textContent = sum.oldestDate ? Math.round((new Date(sum.newestDate) - new Date(sum.oldestDate)) / 86400000 + 1) + '일치 · ' + new Date(sum.newestDate).getFullYear() + '년' : '';
    if (r.startedAt) {
      $('stRun').textContent = '+' + fmtNum(r.processed) + '건' + (r.errors ? ' ⚠️' + fmtNum(r.errors) : '');
      $('stRunD').textContent = fmtDate(r.startedAt) + ' · 감지 ' + fmtNum(r.found) + ' · ' + fmtBytes(r.bytes);
    } else { $('stRun').textContent = '-'; $('stRunD').textContent = ''; }
    renderHistory(d.history || []);
    banner(d.lastError ? d.lastError : '');
    if (running && !state.pollTimer) state.pollTimer = setInterval(loadDashboard, 15000);
    if (!running && state.pollTimer) { clearInterval(state.pollTimer); state.pollTimer = null; }
  }

  function renderHistory(hist) {
    $('histCount').textContent = hist.length;
    var empty = '<tr><td colspan="10" class="empty">아직 실행 이력이 없습니다</td></tr>';
    var okIcon = function (h) { return h.errors ? '<span title="오류 ' + h.errors + '건">⚠️</span>' : '<span title="정상">✅</span>'; };
    var range = function (h) { return h.mailFrom ? fmtDayShort(h.mailFrom) + ' ~ ' + fmtDayShort(h.mailTo) : '-'; };
    $('histMini').innerHTML = hist.slice(0, 3).map(function (h, i) {
      return '<tr><td>' + okIcon(h) + ' ' + fmtDate(h.startedAt) + '</td><td><b style="color:var(--blue-ink)">+' + fmtNum(h.processed) + '</b></td><td>' + fmtNum(h.found) + '</td><td>' + fmtBytes(h.bytes) + '</td><td style="color:var(--muted)">' + range(h) + '</td><td style="text-align:right"><button type="button" class="ib" data-run="' + i + '" title="이 회차 메일 보기">📬</button></td></tr>';
    }).join('') || empty;
    $('histRows').innerHTML = hist.map(function (h, i) {
      return '<tr><td>' + okIcon(h) + ' ' + fmtDate(h.startedAt) + '</td><td>' + dur(h.startedAt, h.finishedAt) + (h.chunks > 1 ? ' <span class="mono" title="이어서 실행 구간">×' + h.chunks + '</span>' : '') + '</td><td>' + fmtNum(h.found) + '</td><td><b style="color:var(--blue-ink)">+' + fmtNum(h.processed) + '</b></td><td>' + fmtNum(h.skipped) + '</td><td' + (h.errors ? ' style="color:var(--red);font-weight:700"' : '') + '>' + fmtNum(h.errors) + '</td><td>' + fmtBytes(h.bytes) + '</td><td style="color:var(--muted)">' + range(h) + (h.limitHit ? ' <span class="pill gray" title="회당 최대 건수 도달">⏭</span>' : '') + '</td><td>' + (h.notifiedTo ? '<span title="' + esc(h.notifiedTo) + '">📨</span>' : '<span style="color:var(--faint)">–</span>') + '</td><td style="text-align:right"><button type="button" class="ib" data-run="' + i + '" title="이 회차 메일 보기">📬</button></td></tr>';
    }).join('') || empty;
  }
  function onRunClick(e) {
    var b = e.target.closest('button[data-run]'); if (!b) return;
    state.ex.run = String(b.dataset.run); state.ex.page = 1;
    showTab('explorer');
    if (state.explorer) renderExplorer();
  }
  $('histRows').addEventListener('click', onRunClick);
  $('histMini').addEventListener('click', onRunClick);

  function loadDashboard() {
    return call('getDashboard').then(renderDashboard).catch(function (e) { $('stateText').textContent = '연결 실패'; banner(e.message || String(e)); });
  }

  // run now (modal)
  $('btnRun').addEventListener('click', function () {
    var d = state.dash || {}, s = d.settings || {};
    $('modalBox').innerHTML = [
      '📧 ' + (d.lastSyncAt ? fmtDate(d.lastSyncAt) + ' 이후 새 메일' : (s.initialStartDate ? s.initialStartDate + ' 이후 전체' : '전체 메일')) + (s.maxPerRun ? ' · 최대 ' + fmtNum(s.maxPerRun) + '건' : ''),
      '📁 ' + (d.folderUrl ? '<a href="' + esc(d.folderUrl) + '" target="_blank" rel="noopener">Drive 폴더</a>' : 'Drive / Mail Backup') + ' · ' + (s.folderBy === 'agenda' ? '안건별' : '라벨별'),
      s.notifyOnComplete ? '📨 ' + esc(s.notifyEmail || d.user) : '🔕 알림 없음',
    ].map(function (l) { return '<div>' + l + '</div>'; }).join('');
    $('modal').hidden = false;
  });
  $('modalCancel').addEventListener('click', function () { $('modal').hidden = true; });
  $('modalOk').addEventListener('click', function () {
    $('modalOk').disabled = true; $('modalOk').innerHTML = '<span class="spin"></span>';
    call('runBackupNow').then(function (d) { renderDashboard(d); toast('▶ 백업을 시작합니다'); })
      .catch(function (e) { toast('실행 실패: ' + (e.message || e), true); })
      .then(function () { $('modal').hidden = true; $('modalOk').disabled = false; $('modalOk').textContent = '백업 시작'; });
  });
  $('swAuto').addEventListener('change', function () {
    var on = this.checked; this.disabled = true;
    call(on ? 'installScheduledTrigger' : 'uninstallScheduledTrigger').then(function (d) { renderDashboard(d); toast(on ? '⏱ 자동 백업 켜짐' : '자동 백업 꺼짐'); })
      .catch(function (e) { toast('실패: ' + (e.message || e), true); }).then(function () { $('swAuto').disabled = false; });
  });

  // ---------- settings ----------
  var form = $('settingsForm');
  function fillSettings(s) {
    ['initialStartDate', 'notifyEmail', 'intervalDays', 'maxPerRun', 'folderId', 'filterQuery'].forEach(function (k) { form.elements[k].value = s[k] == null ? '' : s[k]; });
    ['notifyOnComplete', 'includeSent', 'saveAttachments'].forEach(function (k) { form.elements[k].checked = !!s[k]; });
    setRadio('folderByRadios', s.folderBy); setRadio('layoutRadios', s.folderLayout);
    $('folderLink').hidden = !(state.dash && state.dash.folderUrl); if (state.dash && state.dash.folderUrl) $('folderLink').href = state.dash.folderUrl;
    $('notifyEmail').placeholder = '비우면 ' + ((state.dash && state.dash.user) || '내 계정');
  }
  function setRadio(id, v) { $(id).dataset.value = v; document.querySelectorAll('#' + id + ' button').forEach(function (b) { b.classList.toggle('active', b.dataset.v === v); }); }
  ['folderByRadios', 'layoutRadios'].forEach(function (id) { $(id).addEventListener('click', function (e) { var b = e.target.closest('button[data-v]'); if (b) setRadio(id, b.dataset.v); }); });
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var s = {};
    ['initialStartDate', 'notifyEmail', 'intervalDays', 'maxPerRun', 'folderId', 'filterQuery'].forEach(function (k) { s[k] = form.elements[k].value; });
    ['notifyOnComplete', 'includeSent', 'saveAttachments'].forEach(function (k) { s[k] = form.elements[k].checked; });
    s.folderBy = $('folderByRadios').dataset.value; s.folderLayout = $('layoutRadios').dataset.value;
    $('btnSave').disabled = true; $('btnSave').innerHTML = '<span class="spin"></span>';
    call('saveSettings', s).then(function (d) { renderDashboard(d); fillSettings(d.settings); toast('✔ 저장됨'); })
      .catch(function (err) { toast('저장 실패: ' + (err.message || err), true); })
      .then(function () { $('btnSave').disabled = false; $('btnSave').textContent = '저장'; });
  });

  // ---------- explorer ----------
  var PAGE = 50;
  state.ex.page = 1;
  var LABEL_COLORS = ['#e8f0fe:#1967d2', '#fce8e6:#c5221f', '#e6f4ea:#137333', '#fef7e0:#b06000', '#f3e8fd:#7627bb', '#e4f7fb:#007b83', '#fde7f3:#b80672', '#e8eaed:#3c4043'];
  var AV_COLORS = ['#1a73e8', '#d93025', '#188038', '#f9ab00', '#9334e6', '#12b5cb', '#e52592', '#5f6368'];
  function hash(s) { var h = 0; s = String(s || ''); for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; }
  function labelStyle(name) { var c = LABEL_COLORS[hash(name) % LABEL_COLORS.length].split(':'); return 'background:' + c[0] + ';color:' + c[1]; }
  function emailOf(addr) { var m = String(addr || '').match(/<([^>]+)>/); return m ? m[1] : String(addr || '').trim(); }
  function initialOf(addr) { var n = nameOnly(addr).replace(/["']/g, '').trim(); return (n[0] || '?').toUpperCase(); }
  function gmDate(iso) {
    if (!iso) return ''; var d = new Date(iso); if (isNaN(d)) return esc(iso);
    var now = new Date();
    if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false });
    if (d.getFullYear() === now.getFullYear()) return d.toLocaleDateString('ko-KR', { month: 'short', day: 'numeric' });
    return d.toLocaleDateString('ko-KR', { year: '2-digit', month: 'numeric', day: 'numeric' });
  }
  function gmDateLong(iso) { if (!iso) return ''; var d = new Date(iso); return isNaN(d) ? esc(iso) : d.toLocaleString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short', hour: '2-digit', minute: '2-digit', hour12: false }); }
  function parseAtts(r) {
    var raw = r.attachmentFiles ? String(r.attachmentFiles) : '';
    if (raw) { try { var a = JSON.parse(raw); if (Array.isArray(a)) return a; } catch (e) { /* ignore */ } }
    return String(r.attachments || '').split(';').map(function (n) { return n.trim(); }).filter(Boolean).map(function (n) { return { name: n }; });
  }
  function dlUrl(fileId) { return fileId ? 'https://drive.google.com/uc?export=download&id=' + encodeURIComponent(fileId) : ''; }
  function viewUrl(fileId) { return fileId ? 'https://drive.google.com/file/d/' + encodeURIComponent(fileId) + '/view' : ''; }
  function fileIcon(name, mime) {
    var ext = String(name || '').split('.').pop().toLowerCase(); mime = String(mime || '');
    if (/^image\//.test(mime) || /^(png|jpe?g|gif|webp|bmp|heic)$/.test(ext)) return '🖼️';
    if (mime === 'application/pdf' || ext === 'pdf') return '📕';
    if (/spreadsheet|excel/.test(mime) || /^(xlsx?|csv)$/.test(ext)) return '📗';
    if (/word|document/.test(mime) || /^(docx?|hwpx?)$/.test(ext)) return '📘';
    if (/presentation|powerpoint/.test(mime) || /^pptx?$/.test(ext)) return '📙';
    if (/zip|compressed|tar/.test(mime) || /^(zip|7z|rar|gz|tar)$/.test(ext)) return '🗜️';
    return '📄';
  }
  var FOLDERS = [
    { key: '', ic: '📧', lb: '전체 메일' }, { key: 'inbox', ic: '📥', lb: '받은편지함' }, { key: 'sent', ic: '📤', lb: '보낸편지함' },
    { key: 'starred', ic: '⭐', lb: '중요' }, { key: 'draft', ic: '📝', lb: '임시보관함' }, { key: 'attachments', ic: '📎', lb: '첨부파일' },
  ];
  function folderMatch(r, key) {
    if (!key) return true;
    if (key === 'sent') return isSentRec(r);
    if (key === 'inbox') return !isSentRec(r) && r.category !== '임시보관함';
    if (key === 'starred') return /(^|,\s*)(IMPORTANT|STARRED)(\s*,|$)/.test(String(r.labels || ''));
    if (key === 'draft') return r.category === '임시보관함' || /(^|,\s*)DRAFT(\s*,|$)/.test(String(r.labels || ''));
    if (key === 'attachments') return !!String(r.attachments || '').trim();
    return true;
  }
  function loadExplorer() {
    $('mlist').innerHTML = '<div class="gm-empty">백업 메일 목록을 불러오는 중…</div>';
    return call('getExplorerData').then(function (data) { state.explorer = data; renderExplorer(); })
      .catch(function (e) { $('mlist').innerHTML = '<div class="gm-empty"><b>불러오기 실패</b>' + esc(e.message || e) + '</div>'; });
  }
  function sourceRecords() {
    var recs = (state.explorer && state.explorer.records) || [];
    if (state.ex.run !== 'all') {
      var h = (state.explorer.history || [])[Number(state.ex.run)];
      if (h) recs = recs.filter(function (r) { return r.backedUpAt >= h.startedAt && (!h.finishedAt || r.backedUpAt <= h.finishedAt); });
    }
    return recs;
  }
  function matches(r) {
    var x = state.ex;
    if (!folderMatch(r, x.folder)) return false;
    if (x.agenda && r.agenda !== x.agenda) return false;
    if (x.category && r.category !== x.category) return false;
    if (x.q) { var q = x.q.toLowerCase(); var hay = [r.subject, r.from, r.to, r.cc, r.snippet, r.labels, r.attachments, r.agenda, r.category].join(' | ').toLowerCase(); if (hay.indexOf(q) < 0) return false; }
    return true;
  }
  function navItem(key, val, ic, lb, ct, active, swatch) {
    return '<div class="it' + (active ? ' active' : '') + '" data-k="' + key + '" data-v="' + esc(val) + '">' + (swatch ? '<span class="sw" style="' + swatch + '"></span>' : '<span class="ic">' + ic + '</span>') + '<span class="lb">' + esc(lb) + '</span>' + (ct != null ? '<span class="ct">' + fmtNum(ct) + '</span>' : '') + '</div>';
  }
  function renderNav(src) {
    var x = state.ex, html = '';
    FOLDERS.forEach(function (f) { html += navItem('folder', f.key, f.ic, f.lb, src.filter(function (r) { return folderMatch(r, f.key); }).length, x.folder === f.key && !x.category && !x.agenda); });
    var cats = {}, agendas = {};
    src.forEach(function (r) { if (r.category) cats[r.category] = (cats[r.category] || 0) + 1; if (r.agenda) agendas[r.agenda] = (agendas[r.agenda] || 0) + 1; });
    html += '<div class="sec">라벨</div>';
    Object.keys(cats).sort().forEach(function (c) { html += navItem('category', c, '', c, cats[c], x.category === c, 'background:' + LABEL_COLORS[hash(c) % LABEL_COLORS.length].split(':')[1]); });
    html += '<div class="sec">안건</div>';
    Object.keys(agendas).sort().forEach(function (a) { html += navItem('agenda', a, '💼', a, agendas[a], x.agenda === a); });
    var hist = (state.explorer && state.explorer.history) || [];
    html += '<div class="runsel">🕘 백업 회차<select id="exRun"><option value="all">전체</option>' + hist.map(function (h, i) { return '<option value="' + i + '"' + (String(i) === x.run ? ' selected' : '') + '>' + fmtDay(h.startedAt) + ' (' + fmtNum(h.processed) + '건)</option>'; }).join('') + '</select></div>';
    $('exNav').innerHTML = html;
    var chips = '';
    FOLDERS.forEach(function (f) { chips += '<button type="button" class="chip' + (x.folder === f.key && !x.category && !x.agenda ? ' active' : '') + '" data-k="folder" data-v="' + f.key + '">' + f.ic + ' ' + f.lb + '</button>'; });
    Object.keys(cats).sort().forEach(function (c) { chips += '<button type="button" class="chip' + (x.category === c ? ' active' : '') + '" data-k="category" data-v="' + esc(c) + '">' + esc(c) + '</button>'; });
    Object.keys(agendas).sort().forEach(function (a) { chips += '<button type="button" class="chip' + (x.agenda === a ? ' active' : '') + '" data-k="agenda" data-v="' + esc(a) + '">💼 ' + esc(a) + '</button>'; });
    $('exNavChips').innerHTML = chips;
    var where = x.category ? '라벨: ' + x.category : x.agenda ? '안건: ' + x.agenda : (FOLDERS.filter(function (f) { return f.key === x.folder; })[0] || FOLDERS[0]).lb;
    $('exWhere').textContent = where;
    var fc = '';
    if (x.folder && (x.category || x.agenda)) fc += '<span class="chipx" data-k="folder" data-v="">' + (FOLDERS.filter(function (f) { return f.key === x.folder; })[0] || {}).lb + ' ✕</span>';
    if (x.category && x.agenda) fc += '<span class="chipx" data-k="agenda" data-v="">' + esc(x.agenda) + ' ✕</span>';
    if (x.q) fc += '<span class="chipx" data-k="q" data-v="">🔍 ' + esc(x.q) + ' ✕</span>';
    $('exFilterChips').innerHTML = fc;
  }
  function renderExplorer() {
    var src = sourceRecords();
    var hits = src.filter(matches);
    $('exTotal').textContent = fmtNum(src.length) + '건';
    renderNav(src);
    var pages = Math.max(1, Math.ceil(hits.length / PAGE));
    if (state.ex.page > pages) state.ex.page = pages;
    var start = (state.ex.page - 1) * PAGE, slice = hits.slice(start, start + PAGE);
    $('exPage').textContent = hits.length ? (start + 1) + '–' + (start + slice.length) + ' / ' + fmtNum(hits.length) : '0 / 0';
    $('exPrev').disabled = state.ex.page <= 1; $('exNext').disabled = state.ex.page >= pages;
    $('exClear').hidden = !state.ex.q;
    $('mlist').innerHTML = slice.map(function (r) {
      var out = isSentRec(r), atts = String(r.attachments || '').trim();
      var star = /(^|,\s*)(IMPORTANT|STARRED)(\s*,|$)/.test(String(r.labels || ''));
      var who = out ? '<span class="to">받는사람: </span>' + esc(nameOnly(r.to) || emailOf(r.to)) : esc(nameOnly(r.from) || emailOf(r.from));
      var showCat = r.category && r.category !== '받은편지함' && r.category !== '보낸편지함';
      return '<div class="gm-row' + (state.ex.selected === r.id ? ' active' : '') + '" data-id="' + esc(r.id) + '" title="' + esc(r.subject) + '">' +
        '<span class="star' + (star ? ' on' : '') + '">' + (star ? '★' : '☆') + '</span>' +
        '<span class="sd' + (out ? ' sentme' : '') + '">' + who + '</span>' +
        '<span class="txt">' + (showCat ? '<span class="lb" style="' + labelStyle(r.category) + '">' + esc(r.category) + '</span>' : '') + '<span class="sj">' + esc(r.subject || '(제목 없음)') + '</span><span class="sn"> – ' + esc(r.snippet) + '</span></span>' +
        (atts ? '<span class="att" title="' + esc(atts) + '">📎</span>' : '') +
        '<span class="dt">' + gmDate(r.date) + '</span></div>';
    }).join('') || '<div class="gm-empty"><div style="font-size:40px">📭</div><b>메일이 없습니다</b></div>';
  }
  function setFilter(k, v) {
    var x = state.ex;
    if (k === 'folder') { x.folder = v; x.category = ''; x.agenda = ''; }
    else if (k === 'category') { x.category = (x.category === v ? '' : v); x.agenda = ''; }
    else if (k === 'agenda') { x.agenda = (x.agenda === v ? '' : v); x.category = ''; }
    else if (k === 'q') { x.q = v; $('exQ').value = v; }
    x.page = 1; renderExplorer();
  }
  function onNavClick(e) { var it = e.target.closest('[data-k]'); if (!it || it.tagName === 'SELECT') return; setFilter(it.dataset.k, it.dataset.v); }
  $('exNav').addEventListener('click', onNavClick);
  $('exNavChips').addEventListener('click', onNavClick);
  $('exFilterChips').addEventListener('click', onNavClick);
  $('exNav').addEventListener('change', function (e) { if (e.target.id === 'exRun') { state.ex.run = e.target.value; state.ex.selected = null; state.ex.page = 1; renderExplorer(); } });
  var qTimer;
  $('exQ').addEventListener('input', function () { var v = this.value.trim(); clearTimeout(qTimer); qTimer = setTimeout(function () { state.ex.q = v; state.ex.page = 1; renderExplorer(); }, 150); });
  $('exClear').addEventListener('click', function () { setFilter('q', ''); });
  $('exPrev').addEventListener('click', function () { state.ex.page -= 1; renderExplorer(); $('mlist').scrollTop = 0; });
  $('exNext').addEventListener('click', function () { state.ex.page += 1; renderExplorer(); $('mlist').scrollTop = 0; });
  $('exRefresh').addEventListener('click', function () { state.explorer = null; loadExplorer(); });
  $('mlist').addEventListener('click', function (e) {
    var row = e.target.closest('.gm-row'); if (!row) return;
    var r = (state.explorer.records || []).filter(function (x) { return String(x.id) === row.dataset.id; })[0];
    if (r) openMessage(r);
  });
  function attCard(a) {
    var has = !!a.fileId, icon = fileIcon(a.name, a.mime), isImg = icon === '🖼️';
    return '<div class="gm-card' + (has ? '' : ' nodl') + '" title="' + esc(a.name) + '">' +
      '<div class="pv">' + (has && isImg ? '<img src="https://drive.google.com/thumbnail?id=' + encodeURIComponent(a.fileId) + '&sz=w400" alt="" onerror="this.replaceWith(document.createTextNode(\'🖼️\'))">' : icon) + '</div>' +
      (has ? '<div class="ov"><a href="' + esc(dlUrl(a.fileId)) + '" title="다운로드" target="_blank" rel="noopener">⬇</a><a href="' + esc(viewUrl(a.fileId)) + '" title="Drive에서 열기" target="_blank" rel="noopener">↗</a></div>' : '') +
      '<div class="ft"><span class="ic">' + icon + '</span><span class="nm">' + esc(a.name) + (a.size ? '<span class="sz">' + fmtBytes(a.size) + '</span>' : '') + '</span>' + (has ? '<a href="' + esc(dlUrl(a.fileId)) + '" class="gm-ib" title="다운로드" target="_blank" rel="noopener" style="text-decoration:none">⬇</a>' : '') + '</div></div>';
  }
  function openMessage(r) {
    state.ex.selected = r.id;
    document.querySelectorAll('.gm-row').forEach(function (el) { el.classList.toggle('active', el.dataset.id === String(r.id)); });
    $('split').classList.add('reading');
    var out = isSentRec(r), atts = parseAtts(r), av = AV_COLORS[hash(emailOf(r.from)) % AV_COLORS.length];
    var labels = String(r.labels || '').split(',').map(function (s) { return s.trim(); }).filter(function (s) { return s && !/^(INBOX|SENT|UNREAD|IMPORTANT|STARRED|DRAFT|CATEGORY_\w+)$/.test(s); });
    var chips = (r.category && r.category !== '받은편지함' && r.category !== '보낸편지함' ? [r.category] : []).concat(labels.filter(function (l) { return l !== r.category; }));
    var emlDl = dlUrl(r.driveFileId);
    $('reader').innerHTML =
      '<div class="gm-rt"><button type="button" class="gm-ib gm-back" id="readerBack" title="목록">←</button>' +
      (out ? '<span class="pill purple">📤 보낸 편지</span>' : '<span class="pill blue">📥 받은 편지</span>') + (r.agenda ? '<span class="pill gray" style="margin-left:4px">💼 ' + esc(r.agenda) + '</span>' : '') +
      '<span class="sp"></span>' +
      (emlDl ? '<a class="gm-ib" href="' + esc(emlDl) + '" title="원본(.eml) 다운로드" target="_blank" rel="noopener">⬇</a>' : '') +
      (r.driveUrl ? '<a class="gm-ib" href="' + esc(r.driveUrl) + '" title="Drive에서 원본 열기" target="_blank" rel="noopener">↗</a>' : '') + '</div>' +
      '<div class="gm-msg"><h2>' + esc(r.subject || '(제목 없음)') + chips.map(function (c) { return '<span class="lb" style="' + labelStyle(c) + '">' + esc(c) + '</span>'; }).join('') + '</h2>' +
      '<div class="gm-hd"><div class="gm-av" style="background:' + av + '">' + esc(initialOf(r.from)) + '</div><div class="l">' +
      '<div class="fr"><b>' + esc(nameOnly(r.from) || emailOf(r.from)) + '</b><span style="color:#5f6368">&lt;' + esc(emailOf(r.from)) + '&gt;</span></div>' +
      '<details><summary>받는사람: ' + esc(nameOnly(r.to) || emailOf(r.to) || '-') + (r.cc ? ', 참조 ' + esc(nameOnly(r.cc)) : '') + ' ▾</summary><table>' +
      '<tr><td>보낸사람:</td><td>' + esc(r.from) + '</td></tr><tr><td>받는사람:</td><td>' + esc(r.to || '-') + '</td></tr>' + (r.cc ? '<tr><td>참조:</td><td>' + esc(r.cc) + '</td></tr>' : '') +
      '<tr><td>날짜:</td><td>' + gmDateLong(r.date) + '</td></tr><tr><td>Gmail 라벨:</td><td>' + esc(r.labels || '-') + '</td></tr><tr><td>Drive 폴더:</td><td>' + esc(r.category) + '</td></tr>' +
      '<tr><td>백업:</td><td>' + fmtDate(r.backedUpAt) + ' · ' + fmtBytes(r.sizeBytes) + '</td></tr></table></details></div>' +
      '<div class="r">' + gmDateLong(r.date) + '</div></div>' +
      '<div class="gm-bd" id="readerBody">본문을 불러오는 중…</div>' +
      (atts.length ? '<div class="gm-atts"><div class="t">📎 ' + atts.length + '개' + (atts.some(function (a) { return a.fileId; }) ? ' · <a href="' + esc(state.dash && state.dash.folderUrl ? state.dash.folderUrl : '#') + '" target="_blank" rel="noopener">📁 Drive</a>' : '') + '</div><div class="gm-cards">' + atts.map(attCard).join('') + '</div>' +
        (atts.some(function (a) { return !a.fileId; }) ? '<div class="gm-note">' + (emlDl ? '첨부는 <a href="' + esc(emlDl) + '" target="_blank" rel="noopener">원본(.eml) ⬇</a> 안에 있습니다' : '원본(.eml)에서 열 수 있습니다') + '</div>' : '') + '</div>' : '') +
      '</div>';
    $('readerBack').onclick = function () { $('split').classList.remove('reading'); };
    call('getMessageBody', r.id).then(function (res) { if (state.ex.selected !== r.id) return; $('readerBody').textContent = (res && res.body) ? res.body : (r.snippet || '(본문 미리보기 없음 — Drive의 원본을 열어 확인하세요)'); })
      .catch(function () { $('readerBody').textContent = r.snippet || ''; });
  }

  // ---------- init ----------
  loadDashboard();
})();
</script>
</body>
</html>
